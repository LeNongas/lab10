server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: auth-service-apikeys
          uri: http://localhost:8081
          predicates:
            - Path=/api/api-keys,/api/api-keys/**
          filters:
            - RewritePath=/api/api-keys/(?<segment>.*), /api-keys/${segment}
            - RewritePath=/api/api-keys, /api-keys

        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/courses/**,/api/public/courses/**
          filters:
            - StripPrefix=1

        - id: registration-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/registrations/**
          filters:
            - StripPrefix=1
